name: Validate data

on:
  pull_request:
    paths:
      - "data/**"
      - "config.yaml"
      - "scripts/validate.py"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "config.yaml"
      - "scripts/validate.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: python3 scripts/validate.py

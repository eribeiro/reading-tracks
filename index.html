<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ReadingTracks</title>
  <meta name="description" content="Papers, researchers, venues, and reading tracks for a Systems & AI reading clubs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="./" aria-label="ReadingTracks home">
      <img src="assets/reading-tracks-logo.png" alt="" width="400" height="240">
    </a>
    <div>
      <h1 id="siteTitle">ReadingTracks</h1>
      <p id="siteTagline">Papers, researchers, venues, and reading tracks for a Systems &amp; AI reading club.</p>
      <p>Created by <a id="authorLink" href="https://github.com/eribeiro" target="_blank" rel="noopener">Edward Ribeiro</a></p>
    </div>
  </div>
</header>
<main>
<section class="controls" aria-label="Filters">
  <input id="search" type="search" placeholder="Search title, author, tag, venue..." autocomplete="off">
  <div id="areaFilters" class="chips" aria-label="Areas"></div>

  <div class="select-row">
    <label>Year<select id="year"><option value="">ALL</option></select></label>
    <label>Decade<select id="decade"><option value="">ALL</option></select></label>
    <label>Era<select id="era"><option value="">ALL</option></select></label>
    <label>Track<select id="lineage"><option value="">ALL</option></select></label>
    <label>Venue<select id="venue"><option value="">ALL</option></select></label>
    <label>Type<select id="type"><option value="">ALL</option></select></label>
    <label>Tag<select id="tag"><option value="">ALL</option></select></label>
    <label>Sorting
      <select id="grouping">
        <option value="year">Group by year</option>
        <option value="decade">Group by decade</option>
        <option value="none">No grouping</option>
      </select>
    </label>
  </div>

  <div class="view-row">
    <nav class="tabs" aria-label="Content type">
      <button class="tab active" data-view="papers">Papers</button>
      <button class="tab" data-view="researchers">Researchers</button>
      <button class="tab" data-view="venues">Venues</button>
      <button class="tab" data-view="lineages">Tracks</button>
    </nav>
    <button id="clearFilters" class="secondary">Clean Filters</button>
  </div>
</section>

<section class="summary"><strong id="resultCount">Loading…</strong><span id="activeSummary"></span></section>
<section id="results" class="results" aria-live="polite"></section>
</main>
<footer>
  <span id="siteFooter">Data kept in YAML and statically loaded in the browser.</span>
  <br>
  <small>
    © 2026 Edward Ribeiro. Licensed under the <a href="LICENSE">MIT License</a>.
    Version 1.0.0 · Schema v5 · Commit
    <a href="https://github.com/eribeiro/reading-tracks/commit/568416c26189a5526a01fceeeed12f39a33b732c" target="_blank" rel="noopener">568416c</a>.
  </small>
</footer>
<script src="vendor/js-yaml.min.js"></script>
<script src="app.js"></script>
</body>
</html>
